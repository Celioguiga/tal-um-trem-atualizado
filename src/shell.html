<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Tablatura Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
:root{
  --bg:#08090C;
  --glass:rgba(255,255,255,.045);
  --glass-hi:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09);
  --tx:#F2F3F5; --tx-2:rgba(235,238,244,.62); --tx-3:rgba(235,238,244,.4);
  --do:#C0001A; --re:#ECD200; --mi:#F07300; --fa:#00B050;
  --sol:#0066FF; --la:#8B5E00; --si:#9B5FC0;
  --accent:#3B82FF;
  --paper:#FCFBF7;
  --r:18px;
  --body:-apple-system,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--body);color:var(--tx);min-height:100vh;overflow-x:hidden}

/* ---------- atmosfera: orbs de cor RNFG atrás do vidro ---------- */
.orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;filter:blur(90px)}
.orbs i{position:absolute;border-radius:50%;opacity:.32}
.orbs .o1{width:520px;height:520px;background:var(--sol);top:-180px;left:-120px}
.orbs .o2{width:420px;height:420px;background:var(--si);bottom:-160px;left:30%}
.orbs .o3{width:460px;height:460px;background:var(--mi);top:-140px;right:-140px;opacity:.2}
.orbs .o4{width:300px;height:300px;background:var(--fa);bottom:20%;right:-120px;opacity:.16}
@media (prefers-reduced-motion:no-preference){
  .orbs .o1{animation:drift 26s ease-in-out infinite alternate}
  .orbs .o2{animation:drift 32s ease-in-out infinite alternate-reverse}
  @keyframes drift{to{transform:translate(60px,40px) scale(1.08)}}
}

/* ---------- topo ---------- */
.top{display:flex;align-items:center;gap:16px;padding:18px 26px 14px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:12px}
.mark .dots{display:flex;gap:4px}
.mark .dots i{width:7px;height:7px;border-radius:99px}
.mark h1{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.mark small{font-size:11px;color:var(--tx-3);letter-spacing:.05em;font-weight:400;display:block;margin-top:2px;text-transform:none}
.top .legend{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:99px;
  background:var(--glass);border:1px solid var(--stroke);font-size:10.5px;color:var(--tx-2);
  letter-spacing:.04em;backdrop-filter:blur(14px)}
.chip svg{display:block}

/* ---------- layout bento ---------- */
.app{display:grid;grid-template-columns:350px 1fr;gap:14px;padding:4px 26px 30px;align-items:start}
@media(max-width:920px){.app{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px}

.card{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
  padding:16px 18px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card h3{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--tx-3);margin-bottom:12px}

.lbl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);margin:0 0 5px 2px}
input,select,textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--stroke);
  color:var(--tx);border-radius:10px;padding:8px 11px;font-size:13.5px;font-family:var(--body)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx-3) 50%),linear-gradient(135deg,var(--tx-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
textarea{font-family:var(--mono);font-size:13px;line-height:1.75;min-height:150px;resize:vertical;letter-spacing:.03em}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,255,.22)}
.f{margin-bottom:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* segmented — modos de visualização */
.seg{display:flex;background:rgba(0,0,0,.3);border:1px solid var(--stroke);border-radius:99px;padding:3px;gap:2px}
.seg label{flex:1;text-align:center;font-size:11px;letter-spacing:.06em;padding:6px 4px;border-radius:99px;
  cursor:pointer;color:var(--tx-2);transition:.15s;user-select:none}
.seg input{display:none}
.seg input:checked+span{display:block;background:rgba(255,255,255,.12);border-radius:99px;
  margin:-6px -4px;padding:6px 4px;color:#fff;font-weight:600}

/* botões pill */
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--body);font-size:12.5px;font-weight:600;letter-spacing:.03em;border:1px solid var(--stroke);
  border-radius:99px;padding:9px 16px;cursor:pointer;color:var(--tx);background:var(--glass-hi);
  backdrop-filter:blur(10px);transition:.15s}
button:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:transparent;box-shadow:0 6px 22px rgba(59,130,255,.35)}
button.play{background:rgba(0,176,80,.85);border-color:transparent;box-shadow:0 6px 22px rgba(0,176,80,.3)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default;transform:none}

#avisos{font-size:12px;line-height:1.6;color:#F2C14E;margin-top:10px}
#avisos:empty{display:none}
#avisos .err{color:#FF7B72}

/* ---------- partitura (paper card) ---------- */
.score-card{background:var(--paper);border-radius:var(--r);padding:26px 28px 40px;color:#1d1d1b;
  box-shadow:0 30px 70px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.06) inset;min-height:60vh}
.score-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid #ECE8DC}
.score-head h2{font-size:22px;font-weight:650;letter-spacing:-.01em}
.score-head .meta{font-size:11px;color:#9a937f;letter-spacing:.12em;text-transform:uppercase}
#score{width:100%;overflow-x:auto}
#score svg{display:block}
#score .nt{cursor:pointer}

/* diálogo do código */
dialog{background:#101218;color:var(--tx);border:1px solid var(--stroke);border-radius:var(--r);
  padding:20px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
dialog textarea{min-height:190px}
dialog .btns{margin-top:12px;justify-content:flex-end}

@media print{
  body{background:#fff}
  .top,.col,.orbs{display:none!important}
  .app{display:block;padding:0}
  .score-card{box-shadow:none;border-radius:0;padding:0;min-height:auto}
}
</style>
</head>
<body>

<div class="orbs" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i><i class="o4"></i></div>

<header class="top">
  <div class="mark">
    <div class="dots" id="markDots"></div>
    <div>
      <h1>Real Tablatura Studio</h1>
      <small>Real Nota Forma Grau · Synemusic</small>
    </div>
  </div>
  <div class="legend" id="legenda" aria-label="Legenda RNFG da tonalidade atual"></div>
</header>

<main class="app">
  <div class="col">

    <section class="card" aria-label="Cantiga">
      <h3>Cantiga</h3>
      <div class="f"><span class="lbl">Título</span>
        <input id="titulo" value="O Cravo Brigou com a Rosa"></div>
      <div class="grid2 f">
        <div><span class="lbl">Compasso</span>
          <select id="compasso"><option>2/4</option><option selected>3/4</option><option>4/4</option></select></div>
        <div><span class="lbl">Andamento ♩=</span>
          <input id="andamento" type="number" min="30" max="220" value="90"></div>
      </div>
      <div class="grid2 f">
        <div><span class="lbl">Tonalidade</span>
          <select id="tom">
            <optgroup label="Maior">
              <option value="C" selected>Dó maior</option><option value="G">Sol maior</option>
              <option value="D">Ré maior</option><option value="A">Lá maior</option>
              <option value="E">Mi maior</option><option value="F">Fá maior</option>
              <option value="Bb">Si♭ maior</option><option value="Eb">Mi♭ maior</option>
            </optgroup>
            <optgroup label="Menor">
              <option value="Am">Lá menor</option><option value="Em">Mi menor</option>
              <option value="Bm">Si menor</option><option value="Dm">Ré menor</option>
              <option value="Gm">Sol menor</option><option value="Cm">Dó menor</option>
            </optgroup>
          </select></div>
        <div><span class="lbl">Visualização</span>
          <div class="seg" role="radiogroup" aria-label="Modo de visualização">
            <label><input type="radio" name="modo" value="real" checked><span>Real</span></label>
            <label><input type="radio" name="modo" value="forma"><span>Forma</span></label>
            <label><input type="radio" name="modo" value="trad"><span>Pauta</span></label>
          </div></div>
        <div><span class="lbl">Tablatura</span>
          <select id="selModoTab">
            <option value="proxima">Mais próxima</option>
            <option value="C">Desenho de Dó (C)</option>
            <option value="A">Desenho de Lá (A)</option>
            <option value="G">Desenho de Sol (G)</option>
            <option value="E">Desenho de Mi (E)</option>
            <option value="D">Desenho de Ré (D)</option>
          </select></div>
      </div>
    </section>

    <section class="card" aria-label="Sintaxe Cromus">
      <h3>Sintaxe Cromus · R7</h3>
      <textarea id="cromus" spellcheck="false">-,-,5 | 5,31',76 | 5,4,6 | 6,41',76 | 5~,5,5 | 1',21',2'1' | 7,6,6 | 5,76,42 | 1~,1,-</textarea>
      <div id="avisos" role="status"></div>
    </section>

    <section class="card" aria-label="Reprodução">
      <h3>Reprodução</h3>
      <div class="btns">
        <button class="play" id="btnPlay">▶ Tocar</button>
        <button id="btnStop">■ Parar</button>
        <button class="primary" id="btnRender">Renderizar</button>
      </div>
    </section>

    <section class="card" aria-label="Arquivo e exportação">
      <h3>Arquivo · Exportar</h3>
      <div class="btns">
        <button id="btnCodigo">Código</button>
        <button id="btnSalvar">Salvar</button>
        <button id="btnAbrir">Abrir</button>
        <button id="btnSvg">SVG</button>
        <button id="btnWav">WAV</button>
        <button id="btnPdf">PDF</button>
      </div>
      <input type="file" id="fileInput" accept=".txt,.cromus,.md" style="display:none">
    </section>

  </div>

  <section class="score-card" aria-label="Partitura">
    <div id="score"></div>
  </section>
</main>

<dialog id="dlgCodigo">
  <h3 style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-3);margin-bottom:10px">Código da cantiga</h3>
  <textarea id="txtCodigo" spellcheck="false"></textarea>
  <div class="btns">
    <button class="ghost" id="btnFechar">Fechar</button>
    <button id="btnCopiar">Copiar</button>
    <button class="primary" id="btnImportar">Importar → Partitura</button>
  </div>
</dialog>

<!-- @INJETAR_SCRIPTS -->
</body>
</html>
